version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dreamy-life-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dreamy-life-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dreamy-life-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dreamy-life.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/boot.sh:/pgadmin4/boot.sh
    entrypoint: ["/bin/bash", "/pgadmin4/boot.sh"]

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: dreamy-life-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_started
    env_file:
      - packages/backend/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dreamy-life-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4000
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: dreamy-life-admin
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4000
    depends_on:
      - backend

  whatsapp-gateway:
    build:
      context: .
      dockerfile: packages/whatsapp-gateway/Dockerfile
    container_name: dreamy-life-whatsapp
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - ADMIN_PASSWORD=${WHATSAPP_GATEWAY_PASSWORD:-whatsapp_gateway_admin_2024}
      - SESSION_DIR=/app/sessions
    volumes:
      - whatsapp_sessions:/app/sessions

volumes:
  pgdata:
  pgadmin_data:
  whatsapp_sessions:
