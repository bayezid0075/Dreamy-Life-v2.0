# =============================================================================
# Dreamy Life — Nginx Reverse Proxy
# Drop this into /etc/nginx/sites-available/ and symlink to sites-enabled/
#
#   sudo ln -s /etc/nginx/sites-available/dreamy-life.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# HTTP → HTTPS redirect (uncomment after certbot)
# server {
#     listen 80;
#     server_name dreamy-life.com api.dreamy-life.com admin.dreamy-life.com;
#     return 301 https://$host$request_uri;
# }

# ── Web Frontend (dreamy-life.com) ────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;   # uncomment after certbot
    server_name dreamy-life.com www.dreamy-life.com;

    # SSL (uncomment after certbot)
    # ssl_certificate     /etc/letsencrypt/live/dreamy-life.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dreamy-life.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── API Backend (api.dreamy-life.com) ─────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;
    server_name api.dreamy-life.com;

    # SSL (uncomment after certbot)
    # ssl_certificate     /etc/letsencrypt/live/dreamy-life.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dreamy-life.com/privkey.pem;

    client_max_body_size 10M;

    # CORS — allow cross-origin requests from frontend domains
    set $cors_origin "";
    if ($http_origin ~* "^https://(dreamy-life\.com|www\.dreamy-life\.com|admin\.dreamy-life\.com)$") {
        set $cors_origin $http_origin;
    }

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Add CORS headers to proxied responses
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization, X-Requested-With' always;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Admin Panel (admin.dreamy-life.com) ───────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;
    server_name admin.dreamy-life.com;

    # SSL (uncomment after certbot)
    # ssl_certificate     /etc/letsencrypt/live/dreamy-life.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dreamy-life.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
