# =============================================================================
# PRODUCTION docker-compose — optimized for 1-core / 2 GB VPS
# Build on PC, pull on VPS. Run: bash deploy.sh
# =============================================================================

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: Dreamy_life
      POSTGRES_PASSWORD: '@0075Dreamy_Life_DB6915$'
      POSTGRES_DB: dl_data
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 300M
    shm_size: '128mb'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Dreamy_life -d dl_data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrations (one-shot) ────────────────────────────────────────────────
  migrate:
    image: ghcr.io/bayezid0075/dreamy-life-backend:latest
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - packages/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=Dreamy_life
      - DB_PASSWORD=@0075Dreamy_Life_DB6915$
      - DB_NAME=dl_data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ERROR_LOG_DIR=/app/logs
    volumes:
      - backend-logs:/app/logs
    command:
      - sh
      - -c
      - |
        echo "============================================="
        echo "  Dreamy Life — Database Migration"
        echo "============================================="
        echo ""
        echo ">>> Running drizzle-kit migrate..."
        if npx drizzle-kit migrate 2>&1; then
          echo ">>> Migration completed successfully."
        else
          echo ">>> WARNING: migrate failed, trying push..."
          npx drizzle-kit push 2>&1 || echo ">>> Both migration methods failed. Check database."
        fi
        echo ">>> Migration step complete."

  # ── Seed Admin (one-shot) ──────────────────────────────────────────────
  seed-admin:
    image: ghcr.io/bayezid0075/dreamy-life-backend:latest
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - packages/backend/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=Dreamy_life
      - DB_PASSWORD=@0075Dreamy_Life_DB6915$
      - DB_NAME=dl_data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["node", "-e", "
      const { Pool } = require('pg');
      const bcrypt = require('bcrypt');
      async function seed() {
        const pool = new Pool({
          connectionString: process.env.DATABASE_URL || 
            'postgres://' + process.env.DB_USER + ':' + process.env.DB_PASSWORD + '@' + process.env.DB_HOST + ':' + process.env.DB_PORT + '/' + process.env.DB_NAME
        });
        const email = 'admin@dreamylife.com';
        const accessCode = 'ADMIN001';
        const password = 'admin123';
        const res = await pool.query('SELECT id FROM admins WHERE email = $1', [email]);
        if (res.rows.length > 0) {
          console.log('Admin already exists: ' + email);
        } else {
          const hash = await bcrypt.hash(password, 10);
          await pool.query('INSERT INTO admins (email, access_code, password) VALUES ($1, $2, $3)', [email, accessCode, hash]);
          console.log('Admin created:');
          console.log('  Email: ' + email);
          console.log('  Access Code: ' + accessCode);
          console.log('  Password: ' + password);
        }
        await pool.end();
      }
      seed().catch(e => { console.error(e); process.exit(1); });
    "]

  # ── Backend (NestJS) ─────────────────────────────────────────────────────
  backend:
    image: ghcr.io/bayezid0075/dreamy-life-backend:latest
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=Dreamy_life
      - DB_PASSWORD=@0075Dreamy_Life_DB6915$
      - DB_NAME=dl_data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=https://dreamy-life.com,https://www.dreamy-life.com,https://admin.dreamy-life.com
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:5001
      - UPLOAD_BASE_URL=https://api.dreamy-life.com
      - ERROR_LOG_DIR=/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      whatsapp-gateway:
        condition: service_started
    env_file:
      - packages/backend/.env
    volumes:
      - backend-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Web Frontend (Next.js) ───────────────────────────────────────────────
  web:
    image: ghcr.io/bayezid0075/dreamy-life-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.dreamy-life.com
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 350M

  # ── Admin Panel (Next.js) ────────────────────────────────────────────────
  admin:
    image: ghcr.io/bayezid0075/dreamy-life-admin:latest
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.dreamy-life.com
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 350M

  # ── pgAdmin (Database UI) ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dreamy-life.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: False
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-prod/boot.sh:/pgadmin4/boot.sh
      - ./docker/pgadmin-prod/servers.json:/pgadmin4/servers.json
      - ./docker/pgadmin-prod/config_local.py:/pgadmin4/config_local.py
      - ./docker/pgadmin-prod/pgpass:/pgadmin4/pgpass
    entrypoint: ["/bin/bash", "/pgadmin4/boot.sh"]
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── WhatsApp OTP Gateway (Baileys) ─────────────────────────────────────
  whatsapp-gateway:
    build:
      context: .
      dockerfile: packages/whatsapp-gateway/Dockerfile
    container_name: dreamy-life-whatsapp
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:5001:5001"
    environment:
      - PORT=5001
      - SESSION_DIR=/app/sessions
    volumes:
      - whatsapp_sessions:/app/sessions
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  backend-logs:
  pgadmin_data:
  whatsapp_sessions:
