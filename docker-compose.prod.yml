services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamy_life}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
    restart: always
    depends_on:
      - postgres
    environment:
      DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-dreamy_life}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      BACKEND_URL: ${BACKEND_URL:-https://dreamy-life.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://dreamy-life.com}
      USE_REDIS_CHANNELS: ${USE_REDIS_CHANNELS:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
    ports:
      - "8888:8888"
    volumes:
      - ${ENV_FILE:-./.env}:/app/.env

  frontend:
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dreamy-life.com}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8888}
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dreamy-life.com}
    ports:
      - "3333:3333"

volumes:
  postgres_data:
