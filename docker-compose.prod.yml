# =============================================================================
# PRODUCTION docker-compose — optimized for 1-core / 2 GB VPS
# Build on PC, pull on VPS. Run: bash deploy.sh
# =============================================================================

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2516}
      POSTGRES_DB: ${DB_NAME:-dreamy_life}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 300M
    shm_size: '128mb'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dreamy_life"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrations (one-shot) ────────────────────────────────────────────────
  migrate:
    image: ghcr.io/bayezid0075/dreamy-life-backend:latest
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - packages/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=2516
      - DB_NAME=dreamy_life
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ERROR_LOG_DIR=/app/logs
    volumes:
      - backend-logs:/app/logs
    command:
      - sh
      - -c
      - |
        echo "============================================="
        echo "  Dreamy Life — Database Migration"
        echo "============================================="
        echo "DATABASE_URL=${DATABASE_URL:+<set>}"
        echo ""
        echo ">>> Running drizzle-kit push:pg..."
        if npx drizzle-kit push:pg 2>&1; then
          echo ">>> Schema sync completed successfully."
        else
          echo ">>> WARNING: Schema sync failed, trying migrate..."
          npx drizzle-kit migrate 2>&1 || echo ">>> Migration also failed. Check database."
        fi
        echo ">>> Migration step complete."

  # ── Backend (NestJS) ─────────────────────────────────────────────────────
  backend:
    image: ghcr.io/bayezid0075/dreamy-life-backend:latest
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=2516
      - DB_NAME=dreamy_life
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://bayezid.dreamy-life.com
      - ERROR_LOG_DIR=/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - packages/backend/.env
    volumes:
      - backend-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Web Frontend (Next.js) ───────────────────────────────────────────────
  web:
    image: ghcr.io/bayezid0075/dreamy-life-web:latest
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 350M

  # ── Admin Panel (Next.js) ────────────────────────────────────────────────
  admin:
    image: ghcr.io/bayezid0075/dreamy-life-admin:latest
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  pgdata:
  backend-logs:
