name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to VPS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /root/Dreamy-Life-v2.0

            echo ">>> Pulling latest code..."
            git pull origin master

            echo ">>> Logging in to GitHub Container Registry..."
            if echo "${{ secrets.VPS_CR_PAT }}" | docker login ghcr.io -u bayezid0075 --password-stdin; then
              echo ">>> GHCR login succeeded"
            else
              echo ">>> ERROR: GHCR login failed! Check that VPS_CR_PAT secret is set with read:packages scope."
              exit 1
            fi

            echo ">>> Pulling pre-built images..."
            docker compose -f docker-compose.prod.yml pull

            echo ">>> Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Waiting for health check..."
            sleep 15

            curl -sf http://localhost:4000/health || \
              (echo "Backend health check failed!" && \
               docker compose -f docker-compose.prod.yml logs backend --tail=30 && \
               exit 1)

            echo ">>> Deployment successful!"
