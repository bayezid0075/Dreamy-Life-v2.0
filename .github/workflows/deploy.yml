# =============================================================================
# CI/CD Pipeline — Build, Test & Deploy to VPS
# Triggers on push to master
# =============================================================================

name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  # ── CI: Type-check & Lint ────────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint (non-blocking)
        run: pnpm lint || true

  # ── CD: Build images & push to GHCR, then deploy to VPS ─────────────────
  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & push Backend ────────────────────────────────────────────
      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dreamy-life-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512

      # ── Build & push Web Frontend ──────────────────────────────────────
      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dreamy-life-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

      # ── Build & push Admin Panel ───────────────────────────────────────
      - name: Build & push Admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dreamy-life-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

      # ── Deploy to VPS via SSH ──────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="/root/Dreamy-Life-v2.0"
            cd "$APP_DIR"

            echo "=== Pulling latest code ==="
            git pull origin master

            echo "=== Logging into GHCR ==="
            echo "${{ secrets.VPS_CR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.prod.yml pull --ignore-buildable || true

            echo "=== Building (low-memory mode) ==="
            COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 \
              docker compose -f docker-compose.prod.yml build \
              --build-arg NODE_OPTIONS="--max-old-space-size=512"

            echo "=== Restarting containers ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== Pruning old images ==="
            docker image prune -f

            echo "=== Waiting for health check ==="
            sleep 15

            if curl -sf http://localhost:4000/ > /dev/null 2>&1; then
              echo "Backend is healthy!"
            else
              echo "WARNING: Backend health check failed. Checking logs..."
              docker compose -f docker-compose.prod.yml logs backend --tail=30
            fi

            echo "=== Container status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== Deploy complete ==="
