name: Build, Push & Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dreamy-life

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512

      - name: Build and push Web Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

      - name: Build and push Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:latest
            ${{ env.IMAGE_PREFIX }}-admin:${{ github.sha }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

      - name: Verify images pushed
        run: |
          echo "Images pushed to ghcr.io:"
          echo "  - ${{ env.IMAGE_PREFIX }}-backend:latest"
          echo "  - ${{ env.IMAGE_PREFIX }}-web:latest"
          echo "  - ${{ env.IMAGE_PREFIX }}-admin:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: Deploy to VPS

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            cd /root/Dreamy-Life-v2.0

            echo ">>> Pulling latest code..."
            git pull origin master

            echo ">>> Setting production env vars..."
            if ! grep -q "FRONTEND_URL" .env 2>/dev/null; then
              echo "FRONTEND_URL=http://${{ secrets.VPS_HOST }}" >> .env
            else
              sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=http://${{ secrets.VPS_HOST }}|" .env
            fi
            if ! grep -q "VPS_HOST" .env 2>/dev/null; then
              echo "VPS_HOST=${{ secrets.VPS_HOST }}" >> .env
            else
              sed -i "s|^VPS_HOST=.*|VPS_HOST=${{ secrets.VPS_HOST }}|" .env
            fi
            if ! grep -q "NEXT_PUBLIC_API_URL" .env 2>/dev/null; then
              echo "NEXT_PUBLIC_API_URL=http://${{ secrets.VPS_HOST }}" >> .env
            else
              sed -i "s|^NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=http://${{ secrets.VPS_HOST }}|" .env
            fi

            echo ">>> Logging in to GitHub Container Registry..."
            if echo "${{ secrets.VPS_CR_PAT }}" | docker login ghcr.io -u bayezid0075 --password-stdin; then
              echo ">>> GHCR login succeeded"
            else
              echo ">>> ERROR: GHCR login failed! Check that VPS_CR_PAT secret is set with read:packages scope."
              exit 1
            fi

            echo ">>> Pulling pre-built images (app services only)..."
            docker compose -f docker-compose.prod.yml pull backend web admin

            echo ">>> Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Waiting for health check (migrations may take a minute)..."
            for i in 1 2 3 4 5 6; do
              sleep 15
              if curl -sf http://localhost:4000/health; then
                echo ">>> Backend is healthy!"
                break
              fi
              echo ">>> Attempt $i/6 - backend not ready yet, waiting..."
            done

            curl -sf http://localhost:4000/health || \
              (echo ">>> Backend health check failed after 90s!" && \
               docker compose -f docker-compose.prod.yml logs backend --tail=50 && \
               exit 1)

            echo ">>> Deployment successful!"
